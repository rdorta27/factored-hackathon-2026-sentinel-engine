[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-data"
version = "0.1.0"
description = "Sentinel Engine – Medallion ingestion pipeline for Factored Datathon 2026"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sentinel Team" }]

dependencies = [
    "duckdb==1.1.3",
    "deltalake>=0.17.0",
    "pyarrow>=14.0.0",
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # DuckDB's delta extension requires pytz to decode TIMESTAMP columns when
    # scanning Delta tables locally.  Without it, delta_scan raises
    # InvalidInputException: Required module 'pytz' failed to import.
    "pytz>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
