# =============================================================================
# Databricks Asset Bundle – Sentinel Data Engine
# Docs: https://docs.databricks.com/en/dev-tools/bundles/index.html
#
# Deploy  : databricks bundle deploy  --target dev
# Run job : databricks bundle run medallion_pipeline_job --target dev
# =============================================================================

bundle:
  name: sentinel-data-engine

# ---------------------------------------------------------------------------
# Per-environment overrides
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development          # prepends ${workspace.current_user.userName} to resource names
    default: true
    workspace:
      host: ${var.databricks_host}

  prod:
    mode: production
    workspace:
      host: ${var.databricks_host}

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
variables:
  databricks_host:
    description: "Databricks workspace URL (e.g. https://adb-xxxx.azuredatabricks.net)"
    default: ""
  s3_bucket:
    description: "Source S3 bucket name (set via --var s3_bucket=<name> or TF_VAR_s3_bucket)"
    default: ""
  databricks_catalog:
    description: "Unity Catalog catalog"
    default: "sentinel"
  schema_bronze:
    description: "Unity Catalog schema for the Bronze layer"
    default: "bronze"
  schema_silver:
    description: "Unity Catalog schema for the Silver layer"
    default: "silver"

# ---------------------------------------------------------------------------
# Python wheel artifact – built automatically on every deploy
# ---------------------------------------------------------------------------
artifacts:
  sentinel_wheel:
    type: whl
    path: .                      # directory containing pyproject.toml
    build: "pip install build && python -m build --wheel --outdir dist/"

# ---------------------------------------------------------------------------
# Shared cluster definition (referenced by both pipeline jobs)
# ---------------------------------------------------------------------------
# Defined inline per-job below to allow independent sizing.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  jobs:

    # =========================================================================
    # Medallion Pipeline – Bronze → Silver → Gold (sequential tasks)
    # =========================================================================
    medallion_pipeline_job:
      name: "[Sentinel] Medallion Pipeline – Bronze → Silver → Gold"
      description: >
        End-to-end Medallion ingestion: ingests raw S3 data into Bronze,
        validates, deduplicates, and merges into Silver, then builds the
        three Gold serving tables for the Dispute Intake use case.

      # Cost-optimised single-node cluster reused across tasks
      job_clusters:
        - job_cluster_key: medallion_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"      # Azure – swap for m5.xlarge on AWS
            num_workers: 0                        # driver-only (local[*,4])
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.delta.preview.enabled: "true"
            aws_attributes:
              availability: "SPOT_WITH_FALLBACK"
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"

      tasks:
        # ── Bronze: transactions ─────────────────────────────────────────────
        - task_key: bronze_transactions
          job_cluster_key: medallion_cluster
          python_wheel_task:
            package_name: sentinel_data
            entry_point: sentinel_data.__main__
            parameters:
              - "--layer=bronze"
              - "--table-name=transactions"
              - "--run-mode=databricks"
              - "--s3-bucket=${var.s3_bucket}"
              - "--databricks-catalog=${var.databricks_catalog}"
              - "--databricks-schema=${var.schema_bronze}"
          libraries:
            - whl: ./dist/*.whl

        # ── Bronze: digital_events ───────────────────────────────────────────
        - task_key: bronze_digital_events
          job_cluster_key: medallion_cluster
          python_wheel_task:
            package_name: sentinel_data
            entry_point: sentinel_data.__main__
            parameters:
              - "--layer=bronze"
              - "--table-name=digital_events"
              - "--run-mode=databricks"
              - "--s3-bucket=${var.s3_bucket}"
              - "--databricks-catalog=${var.databricks_catalog}"
              - "--databricks-schema=${var.schema_bronze}"
          libraries:
            - whl: ./dist/*.whl

        # ── Silver: transactions (depends on its Bronze task) ─────────────────
        - task_key: silver_transactions
          depends_on:
            - task_key: bronze_transactions
          job_cluster_key: medallion_cluster
          python_wheel_task:
            package_name: sentinel_data
            entry_point: sentinel_data.__main__
            parameters:
              - "--layer=silver"
              - "--table-name=transactions"
              - "--run-mode=databricks"
              - "--databricks-catalog=${var.databricks_catalog}"
              - "--databricks-schema-bronze=${var.schema_bronze}"
              - "--databricks-schema-silver=${var.schema_silver}"
          libraries:
            - whl: ./dist/*.whl

        # ── Silver: digital_events (depends on its Bronze task) ───────────────
        - task_key: silver_digital_events
          depends_on:
            - task_key: bronze_digital_events
          job_cluster_key: medallion_cluster
          python_wheel_task:
            package_name: sentinel_data
            entry_point: sentinel_data.__main__
            parameters:
              - "--layer=silver"
              - "--table-name=digital_events"
              - "--run-mode=databricks"
              - "--databricks-catalog=${var.databricks_catalog}"
              - "--databricks-schema-bronze=${var.schema_bronze}"
              - "--databricks-schema-silver=${var.schema_silver}"
          libraries:
            - whl: ./dist/*.whl

        # ── Gold: all tables (depends on all Silver tasks) ───────────────────
        - task_key: gold_all
          depends_on:
            - task_key: silver_transactions
            - task_key: silver_digital_events
          job_cluster_key: medallion_cluster
          python_wheel_task:
            package_name: sentinel_data
            entry_point: sentinel_data.__main__
            parameters:
              - "--layer=gold"
              - "--table-name=all"
              - "--run-mode=databricks"
              - "--databricks-catalog=${var.databricks_catalog}"
              - "--databricks-schema-bronze=${var.schema_bronze}"
              - "--databricks-schema-silver=${var.schema_silver}"
          libraries:
            - whl: ./dist/*.whl

      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"   # 03:00 UTC daily
        timezone_id: "UTC"
        pause_status: PAUSED                     # unpause manually in prod
