name: gitleaks

# Scans the full git history for credential shapes on every change, so the
# property is checked continuously instead of once before submission (REQ-0034).
# The manual review in docs/build/security.md covers what a scanner cannot:
# identifiers of resources, such as the dataset bucket name, are not credentials
# and no default rule matches them.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks over the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
