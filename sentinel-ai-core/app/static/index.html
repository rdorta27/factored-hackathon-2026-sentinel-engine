<!doctype html>
<html lang="es-419" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sentinel Engine</title>
<link rel="stylesheet" href="/branding/brand.css">
<link rel="stylesheet" href="/branding/chat.css">
<link rel="stylesheet" href="/ui/styles.css">
<script src="/ui/app.js" defer></script>
</head>
<body>
<div class="chat app">
  <header class="chat-header">
    <span class="chat-badge" data-testid="brand-mark" role="img" aria-label="Sentinel mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20 6v6c0 5-3.5 8.2-8 9.5C7.5 20.2 4 17 4 12V6l8-3.5Z"/><ellipse cx="12" cy="11.5" rx="3.6" ry="2.4"/><circle cx="12" cy="11.5" r="1" fill="currentColor" stroke="none"/></svg></span>
    <div class="app-headings">
      <p class="chat-title" data-i18n="appTitle">Sentinel Engine</p>
      <p class="chat-sub" data-i18n="purposeLine">Disputas de cargos no reconocidos</p>
      <p class="chat-sub" id="reference-date"></p>
    </div>
    <div class="topbar-controls">
      <div id="locale-group" role="group" aria-label="Language">
        <button type="button" class="theme-toggle" data-locale="es-419" data-testid="locale-button" aria-pressed="true">Español · Latinoamérica</button>
        <button type="button" class="theme-toggle" data-locale="es-MX" data-testid="locale-button" aria-pressed="false">Español · México</button>
        <button type="button" class="theme-toggle" data-locale="es-CO" data-testid="locale-button" aria-pressed="false">Español · Colombia</button>
        <button type="button" class="theme-toggle" data-locale="es-AR" data-testid="locale-button" aria-pressed="false">Español · Argentina</button>
        <button type="button" class="theme-toggle" data-locale="pt-BR" data-testid="locale-button" aria-pressed="false">Português · Brasil</button>
      </div>
      <button id="logout" class="theme-toggle" type="button" data-i18n="logoutButton" hidden>Log out</button>
    </div>
  </header>
  <div id="demo-banner" class="msg msg-audit" data-testid="demo-banner" hidden>
    <strong data-i18n="demoBannerTitle">Demo · simulated data</strong>
    <p class="chat-sub" data-i18n="demoBannerText">Test access needs no password</p>
  </div>
  <main>
    <section id="view-login" class="msg msg-bot login-card">
      <h2 class="chat-title" data-i18n="loginTitle">Test login</h2>
      <p class="chat-sub" data-i18n="mockBadge">Demo data</p>
      <div id="demo-personas" data-testid="demo-personas" hidden>
        <h3 class="chat-title" data-i18n="demoPersonasTitle">Pick a test case</h3>
        <div class="chips">
          <button type="button" class="candidate" data-persona="normal" data-testid="demo-persona" data-i18n="personaNormal">Normal case · Mexico</button>
          <button type="button" class="candidate" data-persona="ambiguous" data-testid="demo-persona" data-i18n="personaAmbiguous">Ambiguous case · Portuguese</button>
          <button type="button" class="candidate" data-persona="high-amount" data-testid="demo-persona" data-i18n="personaHighAmount">High amount · Colombia</button>
          <button type="button" class="candidate" data-persona="not-me" data-testid="demo-persona" data-i18n="personaNotMe">“Not me” · Argentina</button>
        </div>
      </div>
      <details id="password-login">
        <summary data-i18n="passwordLoginLink">Use user and password</summary>
        <form id="login-form" class="login-form">
        <label>
          <span data-i18n="userLabel">User</span>
          <input id="login-user" autocomplete="username" required>
        </label>
        <label>
          <span data-i18n="passwordLabel">Password</span>
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </label>
        <button class="confirm-button" type="submit" data-i18n="loginButton">Log in</button>
        <p id="login-error" class="chat-sub" role="alert"></p>
      </form>
      </details>
    </section>
    <section id="view-chat" hidden>
      <div class="chat-grid">
        <div class="chat-thread-col">
          <div id="thread" class="chat-thread" aria-live="polite"></div>
          <div id="demo-prompts" class="chat-candidates" role="group" aria-label="Demo" hidden></div>
          <form id="chat-form" class="chat-input">
            <input id="chat-input" maxlength="2000" required>
            <button type="submit" data-i18n="sendButton">Send</button>
          </form>
          <button id="agent" class="theme-toggle full-width" type="button" data-i18n="agentButton">Talk to an agent</button>
        </div>
        <aside class="chat-panel" aria-labelledby="tx-title">
          <h3 id="tx-title" class="chat-title" data-i18n="txTitle">Your recent charges</h3>
          <p class="chat-sub" data-i18n="txHint">Tap a charge to dispute it</p>
          <div id="transactions" class="tx-list"></div>
        </aside>
      </div>
    </section>
    <section id="view-queue" hidden>
      <div id="queue-list">
        <h3 class="chat-title" data-i18n="queueTitle">Escalated cases</h3>
        <div id="queue" class="tx-list"></div>
      </div>
      <div id="queue-detail" data-testid="queue-detail" hidden></div>
    </section>
  </main>
</div>
</body>
</html>
