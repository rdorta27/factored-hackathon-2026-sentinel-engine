[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "sentinel-ai-core"
version = "0.1.0"
description = "Sentinel Engine – FastAPI backend connecting AI, Gold DuckDB layer, and operational persistence."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "httpx2>=2.0.0",
]
# The trained baseline of the evaluation (decision 007). The pin keeps the model hash stable.
eval = [
    "scikit-learn==1.9.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "attack(id, group): adversarial attack with its honesty group (see tests/adversarial/summary.py)",
]
