<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot 10 · Proof</title>
<link rel="stylesheet" href="../../branding/brand.css">
<link rel="stylesheet" href="mockup.css">
<style>
  .stat { position: absolute; top: 170px; width: 640px; text-align: center; }
  .stat .v { font: 600 220px/1 var(--font-title); color: #fff; letter-spacing: -.02em; }
  .stat .l { font: 400 40px/1.2 var(--font-body); color: #d6d9ea; margin: 10px 0 24px; }
  .bars { position: absolute; left: 240px; top: 620px; width: 1440px; display: grid; gap: 30px; }
  .bar { display: grid; grid-template-columns: 380px 1fr 180px; gap: 26px; align-items: center; font: 500 32px/1.2 var(--font-body); color: #e6e8f5; }
  .track { height: 44px; border-radius: 12px; background: rgba(255,255,255,.08); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 12px; transition: width 1.6s cubic-bezier(.2,.8,.2,1); }
  .fill.grow { width: var(--w); }
  .fill.base { background: #6c6f8a; }
  .fill.ours { background: linear-gradient(90deg, #6d4aff, #ff4f8b); }
  .fill.v3 { background: repeating-linear-gradient(135deg, #8a8fa8 0 14px, #6c6f8a 14px 28px); }
  .val { font: 700 40px/1 var(--font-body); color: #fff; text-align: right; }
  .note { position: absolute; left: 240px; top: 990px; font: 400 22px/1.3 var(--font-body); color: #9aa0bb; }
  .stamp { position: absolute; left: 1250px; top: 860px; }
  .bar.dimmed { opacity: .55; }
</style>
</head>
<body>
<div class="stage">
  <div class="stat" style="left:240px">
    <div class="v pop" data-at="300"><span data-count="400" data-to="42" data-dur="1000">0</span></div>
    <div class="l" data-at="700">attacks tried</div>
    <div data-at="900"><span class="typelabel">Test suite</span></div>
  </div>
  <div class="stat" style="left:1040px">
    <div class="v pop" data-at="2200"><span class="grad">0</span>/42</div>
    <div class="l" data-at="2500">unsafe outcomes</div>
    <div data-at="2700"><span class="typelabel">Test suite</span></div>
  </div>

  <div class="bars">
    <div class="bar" data-at="5000"><span>Plain keywords</span><div class="track"><div class="fill base" style="--w:69.2%" data-class="5300:grow"></div></div><span class="val" data-at="6200">69.2%</span></div>
    <div class="bar" data-at="6800"><span><b>Sentinel</b> router</span><div class="track"><div class="fill ours" style="--w:81.8%" data-class="7100:grow"></div></div><span class="val" data-at="8100">81.8%</span></div>
    <div class="bar" data-at="11500" data-class="15200:dimmed"><span>Newer prompt (v3)</span><div class="track"><div class="fill v3" style="--w:97.4%" data-class="11800:grow"></div></div><span class="val" data-at="12800">97.4%</span></div>
  </div>
  <div class="stamp" data-class="15000:in">Not shipped</div>
  <div class="note" data-at="8600">Intent accuracy on 308 sealed test turns it had never seen · <span class="typelabel" style="font-size:16px;padding:6px 10px">Simulation</span> · v3 failed the safety gate</div>
</div>
<script src="mockup.js"></script>
</body>
</html>
