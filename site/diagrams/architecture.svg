<polygon class="arrow" points="811.0,243.0 804.5,250.7 801.0,242.4"/>
<line class="edge" x1="915.0" y1="155.0" x2="915.0" y2="142.0"/>
<polygon class="arrow" points="915.0,133.0 919.5,142.0 910.5,142.0"/>
<text class="elabel" x="922.0" y="148.0">ticket</text>
<line class="edge dashed" x1="765.0" y1="89.0" x2="796.0" y2="89.0"/>
<polygon class="arrow" points="805.0,89.0 796.0,93.5 796.0,84.5"/>
<text class="elabel" x="785.0" y="83.0" text-anchor="middle">handoff</text>
<line class="edge dashed" x1="245.0" y1="309.0" x2="536.0" y2="309.0"/>
<polygon class="arrow" points="545.0,309.0 536.0,313.5 536.0,304.5"/>
<text class="elabel" x="395.0" y="303.0" text-anchor="middle">session id</text>
<line class="edge dashed" x1="395.0" y1="243.0" x2="395.0" y2="376.0"/>
<polygon class="arrow" points="395.0,385.0 390.5,376.0 399.5,376.0"/>
<line class="edge" x1="915.0" y1="385.0" x2="915.0" y2="362.0"/>
<polygon class="arrow" points="915.0,353.0 919.5,362.0 910.5,362.0"/>
