<line class="edge dashed" data-e="session:tools" x1="245.0" y1="309.0" x2="536.0" y2="309.0"/>
<polygon class="arrow" data-e="session:tools" points="545.0,309.0 536.0,313.5 536.0,304.5"/>
<text class="elabel" x="395.0" y="303.0" text-anchor="middle">id de sessão</text>
<line class="edge dashed" data-e="router:logs" x1="395.0" y1="243.0" x2="395.0" y2="376.0"/>
<polygon class="arrow" data-e="router:logs" points="395.0,385.0 390.5,376.0 399.5,376.0"/>
<line class="edge" data-e="pipeline:gold" x1="915.0" y1="385.0" x2="915.0" y2="362.0"/>
