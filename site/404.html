<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Página no encontrada · Página não encontrada</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#faf8f5;--ink:#1c1830;--brand:#4f2fe0}
@media (prefers-color-scheme:dark){:root{--bg:#14112a;--ink:#f1eefb;--brand:#8e78ff}}
body{margin:0;min-height:100vh;display:grid;place-content:center;gap:20px;padding:16px;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,sans-serif}
h1{font:500 34px Georgia,serif;margin:0}p{margin:0}a{color:var(--brand)}
section{display:grid;gap:4px}
</style>
</head>
<body>
<section lang="en"><h1>Page not found</h1><p>This page does not exist. Go to the <a href="/">Sentinel home page</a>.</p></section>
<section lang="es"><h1>Página no encontrada</h1><p>Esta página no existe. Ve a la <a href="/">página de inicio de Sentinel</a>.</p></section>
<section lang="pt-BR"><h1>Página não encontrada</h1><p>Esta página não existe. Vá para a <a href="/">página inicial do Sentinel</a>.</p></section>
</body>
</html>
