<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Engine</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">Sentinel Engine</h1>
  <div class="controls">
    <label><span data-i18n="languageLabel">Language</span>
      <select id="locale">
        <option value="es-419">es-419</option>
        <option value="es-MX">es-MX</option>
        <option value="es-CO">es-CO</option>
        <option value="es-AR">es-AR</option>
        <option value="pt-BR">pt-BR</option>
      </select>
    </label>
    <button id="theme" type="button" data-i18n="themeToggle">Theme</button>
    <button id="logout" type="button" data-i18n="logoutButton" hidden>Log out</button>
  </div>
</header>
<main>
  <section id="view-login" class="card">
    <h2 data-i18n="loginTitle">Test login</h2>
    <p class="muted"><span data-i18n="mockBadge">Demo data</span></p>
    <form id="login-form">
      <label><span data-i18n="userLabel">User</span>
        <input id="login-user" name="user" autocomplete="username" required>
      </label>
      <label><span data-i18n="passwordLabel">Password</span>
        <input id="login-pass" name="pass" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" data-i18n="loginButton">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="view-chat" class="card" hidden>
    <div class="chat-layout">
      <div class="chat-main">
        <h2 data-i18n="chatTitle">Chat</h2>
        <div id="thread" class="thread" aria-live="polite"></div>
        <form id="chat-form" class="composer">
          <input id="chat-input" data-i18n-ph="chatPlaceholder" placeholder="Describe the charge" maxlength="2000" required>
          <button class="primary-button" type="submit" data-i18n="sendButton">Send</button>
        </form>
        <button id="agent" class="agent-button" type="button" data-i18n="agentButton">Talk to an agent</button>
      </div>
      <aside class="chat-side" aria-labelledby="tx-title">
        <h3 id="tx-title" data-i18n="txTitle">Your recent charges</h3>
        <p class="muted" data-i18n="txHint">Tap a charge to dispute it</p>
        <div id="transactions"></div>
        <p class="muted" id="reference-date"></p>
      </aside>
    </div>
  </section>

  <section id="view-queue" class="card" hidden>
    <h2 data-i18n="queueTitle">Escalated cases</h2>
    <div id="queue"></div>
  </section>

  <section id="view-admin" class="card" hidden>
    <h2 data-i18n="adminTitle">Audit and metrics</h2>
    <div id="metrics"></div>
    <pre id="audit"></pre>
  </section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
